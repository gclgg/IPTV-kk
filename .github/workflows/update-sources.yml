name: 每日更新节目源

on:
  schedule:
    # GitHub Actions 使用 UTC 时间：每天 22:00 UTC = 北京时间次日 06:00
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动触发
    inputs:
      top_n:
        description: '每个频道保留的源数量'
        type: string
        default: '5'
      candidates:
        description: '每个频道参与测速的候选数量（越大越慢）'
        type: string
        default: '15'
      max_seconds:
        description: '总时间预算（秒），到点用已有结果出文件'
        type: string
        default: '1500'
      output:
        description: '输出文件名'
        type: string
        default: '精选源.txt'

permissions:
  contents: write

concurrency:
  group: iptv-sources-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 准备 ffmpeg（测速与分辨率检测）
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -version | head -1

      - name: 抓取、测速、排名并生成精选源
        env:
          IPTVKK_TOP_N: ${{ github.event.inputs.top_n || '5' }}
          IPTVKK_CANDIDATES: ${{ github.event.inputs.candidates || '15' }}
          IPTVKK_MAX_SECONDS: ${{ github.event.inputs.max_seconds || '1500' }}
          IPTVKK_OUTPUT: ${{ github.event.inputs.output || '精选源.txt' }}
        run: |
          # 兼容脚本放在 scripts/ 或仓库根两种布局
          if [ -f scripts/update_sources.py ]; then
            python scripts/update_sources.py
          else
            python update_sources.py
          fi

      - name: 提交变更
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILE="${{ github.event.inputs.output || '精选源.txt' }}"
          if [ -z "$(git status --porcelain -- "$FILE")" ]; then
            echo "::notice::本次没有可更新的内容，跳过提交"
            exit 0
          fi
          git add "$FILE"
          git commit -m "chore: 每日更新精选节目源 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          git push
